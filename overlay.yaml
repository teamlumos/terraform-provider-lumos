  # The API rejects a change to type on update, so changing it creates a new
  # workflow.
  - target: $["components"]["schemas"]["WorkflowInput"]["properties"]["type"]
    update:
      x-speakeasy-param-force-new: true
  # A workflow can be created without an app, and the API gives it the app
  # it's first bound to. Once set, app_id can't change or be cleared: an
  # update with a different app_id is rejected. It follows the config, so
  # leaving it out while Lumos holds one fails the plan instead of planning
  # a change Lumos would refuse. Changing a configured app_id creates a new
  # workflow.
  - target: $["components"]["schemas"]["WorkflowInput"]["properties"]["app_id"]
    update:
