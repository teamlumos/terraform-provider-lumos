  # the app's message, so the provider never fills them in from what the API
  # holds. The clearUnsetFields hook sends null for them on update; the
  # generated client drops nulls. The descriptions go on the request schemas:
  # the entitlement data sources show the response schema, where nothing is
  # configured.
  - target: $["components"]["schemas"]["EntitlementOutput"]["properties"]["description_override","custom_approval_message_override"]
