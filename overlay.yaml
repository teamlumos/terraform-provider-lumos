overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Lumos V1 Terraform provider overlay
  version: 0.0.0
# Applied to original-openapi.json (the V1 spec from `make spec`). This file is
# the endpoint -> Terraform mapping: each resource or data source is an
# x-speakeasy-entity-operation on its endpoints plus x-speakeasy-entity on its
# schema. `make check-overlay` fails if any target below matches nothing in the
# spec, so a renamed or removed endpoint breaks the build instead of silently
# dropping a resource.
actions:
  - target: $["info"]["description"]
    update: >-
      ALPHA: the 1.x line targets the Lumos V1 API and may introduce breaking
      changes without prior notice. Pin an exact version. For production, stay
      on 0.x (version = "~> 0.10").

  # Retry rate limiting and server errors with exponential backoff.
  - target: $
    update:
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 30000
          maxElapsedTime: 60000
          exponent: 1.5
        statusCodes: ["429", "5XX"]
        retryConnectionErrors: true

  # data "lumos_current_user"
  - target: $["paths"]["/v1/users/current"]["get"]
    update:
      x-speakeasy-entity-operation: CurrentUser#read
  - target: $["components"]["schemas"]["User"]
    update:
      x-speakeasy-entity: CurrentUser

  # data "lumos_users". Cursor pagination makes the data source return
  # every page, not just the first.
  - target: $["paths"]["/v1/users"]["get"]
    update:
      x-speakeasy-entity-operation: Users#read
      x-speakeasy-pagination:
        type: cursor
        inputs:
          - name: page_token
            in: parameters
            type: cursor
        # No `results`: the API's contract is that only a null
        # next_page_token ends the list, so a short or empty page must not
        # stop paging.
        outputs:
          nextCursor: $.next_page_token
  - target: $["components"]["schemas"]["UserListOutput"]
    update:
      x-speakeasy-entity: Users
  # Paging is the provider's job, so its parameters stay out of the
  # Terraform schema. Ask for the largest page to cut calls per read.
  - target: $["paths"]["/v1/users"]["get"]["parameters"][?@.name=="page_token"]
    update:
      x-speakeasy-terraform-ignore: true
  - target: $["paths"]["/v1/users"]["get"]["parameters"][?@.name=="page_size"]
    update:
      x-speakeasy-terraform-ignore: true
  - target: $["paths"]["/v1/users"]["get"]["parameters"][?@.name=="page_size"]["schema"]
    update:
      default: 100
  - target: $["components"]["schemas"]["UserListOutput"]["properties"]["next_page_token"]
    update:
      x-speakeasy-terraform-ignore: true
