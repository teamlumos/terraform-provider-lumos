  # Steps: each is a step slug plus its inputs.
  # - inputs is a JSON string, written with jsonencode. The SDK parses it into
  #   an object on the way out and turns the API's object back into a string
  #   on the way in.
  # - inputs uses the StepInputs type, so a key set to null matches the API
  #   leaving that key out.
  # - step comes only from the config, never from the API.
  # - name, a display label the API derives from the step, is left out: the
  #   generated code saves a read-only field inside a list item as null after
  #   every apply.
  - target: $["components"]["schemas"]["WorkflowStepOutput"]["properties"]["step"]
    update:
      x-speakeasy-param-computed: false
  - target: $["components"]["schemas"]["WorkflowStepOutput"]["properties"]["name"]
