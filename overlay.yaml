overlay: 1.0.0
info:
  title: Overlay original-openapi.json => openapi.json
  version: 0.0.0
actions:
  # Update README description
  - target: $["info"]["description"]
    update: "The Lumos provider allows you to manage resources such as Apps, Permissions, and Pre-Approval Rules"

  # HTTP exponential backoff retries
  - target: $
    update:
      "x-speakeasy-retries":
        {
          "strategy": "backoff",
          "backoff":
            {
              "initialInterval": 500,
              "maxInterval": 30000,
              "maxElapsedTime": 60000,
              "exponent": 1.5,
            },
          "statusCodes": ["5XX"],
          "retryConnectionErrors": true,
        }

  # Apps — one lumos_app resource covers custom apps and connected integrations.
  # Update maps to the merged PUT (metadata overrides + reconnect when
  # credentials are present); PATCH stays API-only for back-compat. Delete maps
  # to disconnect (custom apps are deleted, integrations soft-disconnected).
  - target: $["paths"]["/apps"]["post"]
    update:
      "x-speakeasy-entity-operation": "App#create"
  - target: $["paths"]["/apps"]["get"]
    update:
      "x-speakeasy-entity-operation": "Apps#read"
  - target: $["paths"]["/apps/{app_id}"]["put"]
    update:
      "x-speakeasy-entity-operation": "App#update"
      # Reconnect throttles with 429 + Retry-After while a sync is in flight;
      # retry with backoff instead of failing the Terraform apply.
      "x-speakeasy-retries":
        {
          "strategy": "backoff",
          "backoff":
            {
              "initialInterval": 500,
              "maxInterval": 30000,
              "maxElapsedTime": 60000,
              "exponent": 1.5,
            },
          "statusCodes": ["429", "5XX"],
          "retryConnectionErrors": true,
        }
  - target: $["paths"]["/apps/{app_id}"]["put"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"
  - target: $["paths"]["/apps/{app_id}"]["delete"]
    update:
      "x-speakeasy-entity-operation": "App#delete"
  - target: $["paths"]["/apps/{app_id}"]["delete"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"
  - target: $["paths"]["/apps/{app_id}"]["get"]
    update:
      "x-speakeasy-entity-operation": "App#read"
  - target: $["paths"]["/apps/{app_id}"]["get"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"

  # Apps — integration credentials/settings are free-form JSON objects: render
  # them as JSON strings (jsontypes.Normalized) instead of empty structs, and
  # keep credentials out of plan output. Changing app_class_id means a
  # different integration, so it forces a replace (disconnect + connect);
  # auth/settings/version rotate in place through the merged PUT.
  - target: $["components"]["schemas"]["AppInputCreate"]["properties"]["auth"]
    update:
      "x-speakeasy-type-override": "any"
      "x-speakeasy-param-sensitive": true
  - target: $["components"]["schemas"]["AppInputCreate"]["properties"]["settings"]
    update:
      "x-speakeasy-type-override": "any"
  - target: $["components"]["schemas"]["AppInputCreate"]["properties"]["app_class_id"]
    update:
      "x-speakeasy-param-force-new": true
  - target: $["components"]["schemas"]["AppInputPut"]["properties"]["auth"]
    update:
      "x-speakeasy-type-override": "any"
      "x-speakeasy-param-sensitive": true
  - target: $["components"]["schemas"]["AppInputPut"]["properties"]["settings"]
    update:
      "x-speakeasy-type-override": "any"
  - target: $["components"]["schemas"]["AppInputPut"]["properties"]["app_class_id"]
    update:
      "x-speakeasy-param-force-new": true

  # Apps — the lumos_apps data source reconciles what the API manages by
  # default: connection_source=API & disconnected=false unless overridden.
  # The anyOf-nullable wrappers are flattened to plain typed schemas because
  # Speakeasy only emits `default` struct tags for simple schemas (the same
  # shape exact_match has); optionality is preserved by the params being
  # non-required.
  - target: $["paths"]["/apps"]["get"]["parameters"][2]["schema"]["anyOf"]
    remove: true
  - target: $["paths"]["/apps"]["get"]["parameters"][2]["schema"]
    update:
      "type": "string"
      "enum": ["API", "UI"]
      "default": "API"
  - target: $["paths"]["/apps"]["get"]["parameters"][3]["schema"]["anyOf"]
    remove: true
  - target: $["paths"]["/apps"]["get"]["parameters"][3]["schema"]
    update:
      "type": "boolean"
      "default": false

  # App Settings — merge into AppStoreApp entity for drift detection
  - target: $["paths"]["/appstore/apps/{app_id}/settings"]["patch"]
    update:
      "x-speakeasy-entity-operation": "AppStoreApp#update"
  - target: $["paths"]["/appstore/apps/{app_id}/settings"]["get"]
    update:
      "x-speakeasy-entity-operation": "AppStoreApp#read#2"
  - target: $["paths"]["/appstore/apps/{app_id}/settings"]["patch"]["parameters"][0]
    update:
      "x-speakeasy-match": "app_id"
  - target: $["paths"]["/appstore/apps/{app_id}/settings"]["get"]["parameters"][0]
    update:
      "x-speakeasy-match": "app_id"

  # Preserve AppStoreAppSettings data source
  - target: $["paths"]["/apps/{app_id}/settings"]["get"]
    update:
      "x-speakeasy-entity-operation": "AppStoreAppSettings#read"
  - target: $["paths"]["/apps/{app_id}/settings"]["get"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"

  # Users
  - target: $["paths"]["/users"]["get"]
    update:
      "x-speakeasy-entity-operation": "Users#read"
  - target: $["paths"]["/users/{user_id}"]["get"]
    update:
      "x-speakeasy-entity-operation": "User#read"

  # Groups
  - target: $["paths"]["/groups/{group_id}"]["get"]
    update:
      "x-speakeasy-entity-operation": "Group#read"
  - target: $["paths"]["/groups"]["get"]
    update:
      "x-speakeasy-entity-operation": "Groups#read"

  # Groups - ensure that ordering does not matter for allowed groups
  - target: $["components"]["schemas"]["AllowedGroupsConfigInput"]["properties"]["groups"]
    update:
      "format": "set"
  - target: $["components"]["schemas"]["AllowedGroupsConfigOutput"]["properties"]["groups"]
    update:
      "format": "set"

  # Groups - ensure that ordering does not matter for approver groups/users
  - target: $["components"]["schemas"]["AppApproversInput"]["properties"]["groups"]
    update:
      "format": "set"
  - target: $["components"]["schemas"]["AppApproversInput"]["properties"]["users"]
    update:
      "format": "set"
  - target: $["components"]["schemas"]["AppApproversOutput"]["properties"]["groups"]
    update:
      "format": "set"
  - target: $["components"]["schemas"]["AppApproversOutput"]["properties"]["users"]
    update:
      "format": "set"

  # Requestable Permissions
  - target: $["paths"]["/appstore/requestable_permissions"]["post"]
    update:
      "x-speakeasy-entity-operation": "RequestablePermission#create"
  - target: $["paths"]["/appstore/requestable_permissions/{permission_id}"]["get"]
    update:
      "x-speakeasy-entity-operation": "RequestablePermission#read"
  - target: $["paths"]["/appstore/requestable_permissions/{permission_id}"]["get"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"
  - target: $["paths"]["/appstore/requestable_permissions/{permission_id}"]["delete"]
    update:
      "x-speakeasy-entity-operation": "RequestablePermission#delete"
  - target: $["paths"]["/appstore/requestable_permissions/{permission_id}"]["delete"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"
  - target: $["paths"]["/appstore/requestable_permissions/{permission_id}"]["patch"]
    update:
      "x-speakeasy-entity-operation": "RequestablePermission#update"
  - target: $["paths"]["/appstore/requestable_permissions/{permission_id}"]["patch"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"

  # Requestable Permission - Request Config Validation
  - target: $["components"]["schemas"]["RequestConfigInputCreate"]
    update:
      "x-speakeasy-plan-validators": "RequestConfigInputValidator"
  - target: $["components"]["schemas"]["RequestConfigInputUpdate"]
    update:
      "x-speakeasy-plan-validators": "RequestConfigInputValidator"

  # Requestable Permissions Suppress Computed Diff
  # See https://lumos-app.slack.com/archives/C075PHWEN1Z/p1721757223429329 for full context
  - target: $["components"]["schemas"]["RequestConfigInputCreate"]
    update:
      "x-speakeasy-param-suppress-computed-diff": true
  - target: $["components"]["schemas"]["RequestablePermissionOutput"]["properties"]["id"]
    update:
      "x-speakeasy-param-suppress-computed-diff": true
  - target: $["components"]["schemas"]["RequestablePermissionOutput"]["properties"]["type"]
    update:
      "x-speakeasy-param-suppress-computed-diff": true
  - target: $["components"]["schemas"]["RequestablePermissionInput"]["properties"]["app_class_id"]
    update:
      "x-speakeasy-param-suppress-computed-diff": true
  - target: $["components"]["schemas"]["RequestablePermissionInput"]["properties"]["app_instance_id"]
    update:
      "x-speakeasy-param-suppress-computed-diff": true

  # Bulk data source
  - target: $["paths"]["/appstore/requestable_permissions"]["get"]
    update:
      "x-speakeasy-entity-operation": "RequestablePermissions#read"

  # Requestable Permissions - request_approval_stages is deprecated
  - target: $["components"]["schemas"]["RequestApprovalConfigInput"]["properties"]["request_approval_stages"]
    update:
      "x-speakeasy-terraform-ignore": true
  - target: $["components"]["schemas"]["RequestApprovalConfigOutput"]["properties"]["request_approval_stages"]
    update:
      "x-speakeasy-terraform-ignore": true

  # Pre Approval Rules
  - target: $["paths"]["/appstore/pre_approval_rules"]["post"]
    update:
      "x-speakeasy-entity-operation": "PreApprovalRule#create"
  - target: $["paths"]["/appstore/pre_approval_rules/{pre_approval_rule_id}"]["get"]
    update:
      "x-speakeasy-entity-operation": "PreApprovalRule#read"
  - target: $["paths"]["/appstore/pre_approval_rules/{pre_approval_rule_id}"]["get"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"
  - target: $["paths"]["/appstore/pre_approval_rules/{pre_approval_rule_id}"]["delete"]
    update:
      "x-speakeasy-entity-operation": "PreApprovalRule#delete"
  - target: $["paths"]["/appstore/pre_approval_rules/{pre_approval_rule_id}"]["delete"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"
  - target: $["paths"]["/appstore/pre_approval_rules/{pre_approval_rule_id}"]["patch"]
    update:
      "x-speakeasy-entity-operation": "PreApprovalRule#update"
  - target: $["paths"]["/appstore/pre_approval_rules/{pre_approval_rule_id}"]["patch"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"
  - target: $["components"]["schemas"]["PreApprovalRuleOutput"]["properties"]["id"]
    update:
      "x-speakeasy-param-suppress-computed-diff": true

  # Pre Approval Rules - ensure that ordering does not matter for relationship-backed
  # collections. The API returns these in a non-deterministic / internal-id-sorted order
  # that won't match the order declared in HCL, producing perpetual Terraform diffs when
  # modeled as lists (FLWPLT-1144 / FLWPLT-1154). Treating them as sets makes the diff
  # order-independent. Input, UpdateInput, and Output must all be converted to keep the
  # merged resource schema consistent (create, update, and read paths respectively).
  - target: $["components"]["schemas"]["PreApprovalRuleInput"]["properties"]["preapproved_permissions"]
    update:
      "format": "set"
  - target: $["components"]["schemas"]["PreApprovalRuleOutput"]["properties"]["preapproved_permissions"]
    update:
      "format": "set"
  - target: $["components"]["schemas"]["PreApprovalRuleInput"]["properties"]["preapproved_groups"]
    update:
      "format": "set"
  - target: $["components"]["schemas"]["PreApprovalRuleOutput"]["properties"]["preapproved_groups"]
    update:
      "format": "set"
  - target: $["components"]["schemas"]["PreApprovalRuleInput"]["properties"]["preapproval_webhooks"]
    update:
      "format": "set"
  - target: $["components"]["schemas"]["PreApprovalRuleOutput"]["properties"]["preapproval_webhooks"]
    update:
      "format": "set"
  - target: $["components"]["schemas"]["PreApprovalRuleUpdateInput"]["properties"]["preapproved_permissions"]
    update:
      "format": "set"
  - target: $["components"]["schemas"]["PreApprovalRuleUpdateInput"]["properties"]["preapproved_groups"]
    update:
      "format": "set"
  - target: $["components"]["schemas"]["PreApprovalRuleUpdateInput"]["properties"]["preapproval_webhooks"]
    update:
      "format": "set"

  # Access Policies - Add x-speakeasy-type-override to access_condition
  # so that it can be constructed as a JSON object.
  - target: $["components"]["schemas"]["AccessPolicyInput"]["properties"]["access_condition"]
    update:
      "x-speakeasy-type-override": "any"
  - target: $["components"]["schemas"]["AccessPolicyOutput"]["properties"]["access_condition"]
    update:
      "x-speakeasy-type-override": "any"

  # Access Policies
  - target: $["paths"]["/access_policies"]["post"]
    update:
      "x-speakeasy-entity-operation": "AccessPolicy#create"
  - target: $["paths"]["/access_policies"]["get"]
    update:
      "x-speakeasy-entity-operation": "AccessPolicies#read"
  - target: $["paths"]["/access_policies/{access_policy_id}"]["get"]
    update:
      "x-speakeasy-entity-operation": "AccessPolicy#read"
  - target: $["paths"]["/access_policies/{access_policy_id}"]["get"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"
  - target: $["paths"]["/access_policies/{access_policy_id}"]["put"]
    update:
      "x-speakeasy-entity-operation": "AccessPolicy#update"
  - target: $["paths"]["/access_policies/{access_policy_id}"]["put"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"
  - target: $["paths"]["/access_policies/{access_policy_id}"]["delete"]
    update:
      "x-speakeasy-entity-operation": "AccessPolicy#delete"
  - target: $["paths"]["/access_policies/{access_policy_id}"]["delete"]["parameters"][0]
    update:
      "x-speakeasy-name-override": "id"

  # AppStore Apps - remove default from read-only field to prevent perpetual Terraform diff
  - target: $["components"]["schemas"]["AppStoreAppSettingsRequestFlowOutput"]["properties"]["response_describes_entire_approval_workflow"]["default"]
    remove: true

  # AppStore Apps
  - target: $["paths"]["/appstore/apps"]["post"]
    update:
      "x-speakeasy-entity-operation": "AppStoreApp#create"
  - target: $["paths"]["/appstore/apps/{app_id}"]["get"]
    update:
      "x-speakeasy-entity-operation": "AppStoreApp#read#1"
  - target: $["paths"]["/appstore/apps/{app_id}"]["delete"]
    update:
      "x-speakeasy-entity-operation": "AppStoreApp#delete"

  # Apps
  - target: $["components"]["schemas"]["App"]
    update:
      "x-speakeasy-entity": "App"
  - target: $["components"]["schemas"]["App"]["properties"]["id"]
    update:
      "x-speakeasy-param-suppress-computed-diff": true
  - target: $["components"]["schemas"]["AppInputCreate"]
    update:
      "x-speakeasy-entity": "App"

  # AppStore Apps
  - target: $["components"]["schemas"]["AppStoreApp"]
    update:
      "x-speakeasy-entity": "AppStoreApp"
      "x-speakeasy-param-suppress-computed-diff": true
  - target: $["components"]["schemas"]["AppApproversOutput"]
    update:
      "x-speakeasy-param-suppress-computed-diff": true
  - target: $["components"]["schemas"]["AppStoreAppSettingsOutput"]
    update:
      "x-speakeasy-param-suppress-computed-diff": true

  # Groups
  - target: $["components"]["schemas"]["Page_Group_"]
    update:
      "x-speakeasy-entity": "Groups"

  # Apps
  - target: $["components"]["schemas"]["Page_App_"]
    update:
      "x-speakeasy-entity": "Apps"

  # Users
  - target: $["components"]["schemas"]["Page_User_"]
    update:
      "x-speakeasy-entity": "Users"

  # Requestable Permissions
  - target: $["components"]["schemas"]["Page_RequestablePermissionOutput_"]
    update:
      "x-speakeasy-entity": "RequestablePermissions"

  # Access Policies
  - target: $["components"]["schemas"]["AccessPolicyOutput"]
    update:
      "x-speakeasy-entity": "AccessPolicy"
  - target: $["components"]["schemas"]["AccessPolicyOutput"]["properties"]["id"]
    update:
      "x-speakeasy-param-suppress-computed-diff": true
  - target: $["components"]["schemas"]["Page_AccessPolicyOutput_"]
    update:
      "x-speakeasy-entity": "AccessPolicies"


  # Don't attempt to unmarshal 404 respones
  - target: $["paths"]["/appstore/requestable_permissions/{permission_id}"]["get"]["responses"]["404"]["content"]
    remove: true

  # Handle FastAPI vs. Starlette HTTPException diffs -
  #  https://fastapi.tiangolo.com/tutorial/handling-errors/#fastapis-httpexception-vs-starlettes-httpexception
  - target: $["components"]["schemas"]["HTTPValidationError"]["properties"]["detail"]
    update:
      "oneOf": [{"type": "array", "items": {"$ref": "#/components/schemas/ValidationError"}}, {"type": "string"}]
  - target: $["components"]["schemas"]["HTTPValidationError"]["properties"]["detail"]["type"]
    remove: true
  - target: $["components"]["schemas"]["HTTPValidationError"]["properties"]["detail"]["items"]
    remove: true

  # Make time_based_access nullable to prevent perpetual Terraform diff
  # when time_based_access_override is false and time_based_access is omitted from config.
  # Without this, Speakeasy generates code that always creates an empty slice [],
  # which differs from null (omitted) in Terraform's type system.

  # RequestFulfillmentConfigOutput
  - target: $["components"]["schemas"]["RequestFulfillmentConfigOutput"]["properties"]["time_based_access"]
    update:
      anyOf:
        - type: array
          items:
            type: string
        - type: "null"
  - target: $["components"]["schemas"]["RequestFulfillmentConfigOutput"]["properties"]["time_based_access"]["type"]
    remove: true
  - target: $["components"]["schemas"]["RequestFulfillmentConfigOutput"]["properties"]["time_based_access"]["items"]
    remove: true

  # RequestFulfillmentConfigInput
  - target: $["components"]["schemas"]["RequestFulfillmentConfigInput"]["properties"]["time_based_access"]
    update:
      anyOf:
        - type: array
          items:
            type: string
        - type: "null"
  - target: $["components"]["schemas"]["RequestFulfillmentConfigInput"]["properties"]["time_based_access"]["type"]
    remove: true
  - target: $["components"]["schemas"]["RequestFulfillmentConfigInput"]["properties"]["time_based_access"]["items"]
    remove: true

  # RequestFulfillmentConfigInputUpdate
  - target: $["components"]["schemas"]["RequestFulfillmentConfigInputUpdate"]["properties"]["time_based_access"]
    update:
      anyOf:
        - type: array
          items:
            type: string
        - type: "null"
  - target: $["components"]["schemas"]["RequestFulfillmentConfigInputUpdate"]["properties"]["time_based_access"]["type"]
    remove: true
  - target: $["components"]["schemas"]["RequestFulfillmentConfigInputUpdate"]["properties"]["time_based_access"]["items"]
    remove: true


  # Tasks endpoints - not exposed via Terraform. Exclude from SDK generation.
  - target: $["paths"]["/tasks"]
    remove: true
  - target: $["paths"]["/tasks/{task_id}"]
    remove: true
  - target: $["paths"]["/tasks/{task_id}/actions"]
    remove: true
  - target: $["paths"]["/tasks/{task_id}/comments"]
    remove: true
  - target: $["paths"]["/tasks/{task_id}/complete"]
    remove: true
  - target: $["paths"]["/tasks/{task_id}/dismiss"]
    remove: true
  - target: $["paths"]["/tasks/{task_id}/perform-action"]
    remove: true
  - target: $["paths"]["/tasks/{task_id}/reassign"]
    remove: true

  # AccessRequest.tasks references Task schemas. Remove the field so Task
  # shared schemas don't get pulled into the SDK via AccessRequest.
  - target: $["components"]["schemas"]["AccessRequest"]["properties"]["tasks"]
    remove: true

  # Access review endpoints - not exposed via Terraform. Exclude from SDK generation.
  - target: $["paths"]["/access_reviews"]
    remove: true
  - target: $["paths"]["/access_reviews/scope_options"]
    remove: true
  - target: $["paths"]["/access_reviews/{access_review_id}"]
    remove: true
  - target: $["paths"]["/access_reviews/{access_review_id}/apps"]
    remove: true
  - target: $["paths"]["/access_reviews/{access_review_id}/apps/{arda_id}"]
    remove: true

  # Knowledge context endpoints - not exposed via Terraform. Exclude from SDK generation.
  - target: $["paths"]["/v1/knowledge/context"]
    remove: true
  - target: $["paths"]["/v1/knowledge/context/{knowledge_context_id}"]
    remove: true

  # Integration catalog / connection-schema discovery and the sync trigger back the
  # lumos_app connect flow, but nothing maps them to Terraform entities yet, so they
  # would generate unreachable SDK code. Drop these removals when the data sources
  # that expose them land.
  - target: $["paths"]["/integrations"]
    remove: true
  - target: $["paths"]["/integrations/{app_class_id}"]
    remove: true
  - target: $["paths"]["/integrations/{app_class_id}/connection-schema"]
    remove: true
  - target: $["paths"]["/apps/{app_id}/sync"]
    remove: true

  # App Store redirect / default-permission settings are not mapped to Terraform
  # attributes yet. Generating them pulls RequestablePermissionBase into the
  # provisioning subtree, which renames the deduplicated tfTypes the
  # RequestConfigInputValidator depends on. Drop these removals in the change
  # that maps the fields and updates that validator together.
  - target: $["components"]["schemas"]["AddAppToAppStoreInput"]["properties"]["redirect_url"]
    remove: true
  - target: $["components"]["schemas"]["AppSettingInput"]["properties"]["redirect_url"]
    remove: true
  - target: $["components"]["schemas"]["AppSettingOutput"]["properties"]["redirect_url"]
    remove: true
  - target: $["components"]["schemas"]["AppStoreAppSettingsInput"]["properties"]["redirect_url"]
    remove: true
  - target: $["components"]["schemas"]["AppStoreAppSettingsOutput"]["properties"]["redirect_url"]
    remove: true
  - target: $["components"]["schemas"]["AppStoreAppSettingsProvisioningInput"]["properties"]["default_permission"]
    remove: true
  - target: $["components"]["schemas"]["AppStoreAppSettingsProvisioningInput"]["properties"]["default_time_based_access_option"]
    remove: true
  - target: $["components"]["schemas"]["AppStoreAppSettingsProvisioningOutput"]["properties"]["default_permission"]
    remove: true
  - target: $["components"]["schemas"]["AppStoreAppSettingsProvisioningOutput"]["properties"]["default_time_based_access_option"]
    remove: true
