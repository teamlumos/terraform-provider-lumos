      description: >-
        UUID of the app this workflow belongs to. Leave it out for a workflow
        not yet tied to an app. Once the workflow has an app, set when it's
        created or by binding it, Lumos can't clear or change it, so the
        config must set it.
  - target: $["components"]["schemas"]["Workflow"]["properties"]["app_id"]
