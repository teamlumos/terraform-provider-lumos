  # a plan keeps the current value of everything else instead of showing it
  # as known after apply.
  - target: $["components"]["schemas"]["EntitlementOutput"]["properties"]["id","app_id","entitlement_type_label","source","approval_workflow_override","provisioning_workflow","deprovisioning_workflow","appstore_settings"]
    update:
      x-speakeasy-param-suppress-computed-diff: true
  # description is what requesters see: description_override if set,
  # otherwise the integration's. It changes only with description_override.
  - target: $["components"]["schemas"]["EntitlementOutput"]["properties"]["description"]
    update:
      x-speakeasy-plan-modifiers: UnknownOnDescriptionOverrideChange
