      x-speakeasy-param-computed: false
  # The API stores an omitted description as "" and reads it back that way.
  # The read turns "" into null so a config without a description matches,
  # and the input refuses "" so a config can't ask for the value that reads
  # back as null.
  - target: $["components"]["schemas"]["WorkflowInput"]["properties"]["description"]["anyOf"]
