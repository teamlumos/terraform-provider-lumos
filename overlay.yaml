  # resource and data "lumos_access_policy". PUT, not PATCH: a policy's
  # grants are always written as a whole set, which is what a config holds.
  - target: $["paths"]["/v1/access-policies"]["post"]
    update:
      x-speakeasy-entity-operation: AccessPolicy#create
  - target: $["paths"]["/v1/access-policies/{access_policy_id}"]["get"]
    update:
      x-speakeasy-entity-operation: AccessPolicy#read
  - target: $["paths"]["/v1/access-policies/{access_policy_id}"]["put"]
    update:
      x-speakeasy-entity-operation: AccessPolicy#update
  - target: $["paths"]["/v1/access-policies/{access_policy_id}"]["delete"]
    update:
      x-speakeasy-entity-operation: AccessPolicy#delete
  - target: $["paths"]["/v1/access-policies/{access_policy_id}"][*]["parameters"][?@.name=="access_policy_id"]
    update:
      x-speakeasy-match: id
  - target: $["components"]["schemas"]["AccessPolicyOutput"]
    update:
      x-speakeasy-entity: AccessPolicy
      x-speakeasy-entity-description: >-
        An access policy: the apps and entitlements that identities matching
        its condition can get. Destroying it doesn't revoke access already
        granted through it.
  # A read describes an everyone policy twice: is_everyone_condition is true
  # and access_condition holds the condition Lumos uses to match everyone.
  # A config sets one or the other, so the read keeps only the flag. Null
  # operators (List writes every unset one) are dropped because a config
  # never has them.
  - target: $["components"]["schemas"]["AccessPolicyOutput"]
    update:
      x-speakeasy-transform-from-api:
        jq: |
          if . == null then . else
            if .is_everyone_condition then .access_condition = null
            else .access_condition |= (if . == null then . else walk(if type == "object" then with_entries(select(.value != null)) else . end) end)
            end
          end
  - target: $["components"]["schemas"]["AccessPolicyOutput"]["properties"]["is_everyone_condition"]
    update:
      description: True when the policy applies to everyone in your organization. `access_condition` is then null.
  - target: $["components"]["schemas"]["AccessPolicyOutput"]["required"]
    remove: true
  - target: $["components"]["schemas"]["AccessPolicyOutput"]
    update:
      required: ["name", "business_justification", "id", "status", "is_enabled", "apps", "is_everyone_condition"]
  # Labels are dropped: a config never sets them, and a set element has to
  # match the config's whole value.
  - target: $["components"]["schemas"]["AccessPolicyAppOutput","AccessPolicyEntitlementOutput"]["properties"]["label"]
    remove: true
  - target: $["components"]["schemas"]["AccessPolicyAppOutput","AccessPolicyEntitlementOutput"]["required"]
    remove: true
  - target: $["components"]["schemas"]["AccessPolicyAppOutput","AccessPolicyEntitlementOutput"]
    update:
      required: ["id"]
  # The API doesn't keep the order of apps or entitlements.
  - target: $["components"]["schemas"]["AccessPolicyInput","AccessPolicyOutput"]["properties"]["apps"]
    update:
      format: set
  - target: $["components"]["schemas"]["AccessPolicyAppOutput"]["properties"]["entitlements"]
    update:
      format: set
  # Set elements are matched on their whole value, so each app's fields need
  # one value whether or not the config sets them. The API stores a missing
  # is_preapproved as false. A grant on the app itself reads back as an empty
  # entitlements set, so leaving entitlements out plans an empty set.
  - target: $["components"]["schemas"]["AccessPolicyAppInput"]["properties"]["is_preapproved","entitlements"]["anyOf"]
    remove: true
  - target: $["components"]["schemas"]["AccessPolicyAppInput"]["properties"]["is_preapproved"]
    update:
      type: boolean
      default: false
  - target: $["components"]["schemas"]["AccessPolicyAppInput"]["properties"]["entitlements"]
    update:
      type: array
      items: {"$ref": "#/components/schemas/EntitlementRefInput"}
      format: set
      x-speakeasy-plan-modifiers: EmptyWhenNull
      description: >-
        The entitlements granted for this app. Leave it out, or set it to an
        empty set, to grant access to the app itself rather than to specific
        entitlements.
  # The framework marks computed values unknown when a config value differs
  # from state, before plan modifiers run, so an omitted entitlements set
  # would otherwise plan the id as unknown on every run. The id never changes.
  - target: $["components"]["schemas"]["AccessPolicyOutput"]["properties"]["id"]
    update:
      x-speakeasy-param-suppress-computed-diff: true
  # Set in the config or not at all: an everyone policy has none, and
  # removing it from the config must not send the previous one.
  - target: $["components"]["schemas"]["AccessPolicyInput"]["properties"]["access_condition"]
    update:
      x-speakeasy-type-override: any
      x-speakeasy-param-computed: false
  - target: $["components"]["schemas"]["AccessPolicyOutput"]["properties"]["access_condition"]
    update:
      x-speakeasy-type-override: any
  # The spec's descriptions tell API callers what to send; these say what a
  # config sets.
  - target: $["components"]["schemas"]["AccessPolicyInput"]["properties"]
    update:
      is_everyone_condition:
        description: >-
          Whether the policy applies to everyone in the organization. Set it to
          `true` instead of setting `access_condition`.
      access_condition:
        description: >-
          The condition an identity must match for the policy to apply, as a
          Lumos condition written with `jsonencode`. Give every attribute and
          value as `{ label, value }`, the form Lumos reads back. Leave it out
          when `is_everyone_condition` is `true`. See [building conditions in
          Lumos](https://docs.lumos.com/kb/life_cycle_management/building-conditions-in-lumos).
      status:
        description: >-
          `draft` or `published`. A published policy can't go back to
          `draft`.
      is_enabled:
        description: >-
          Whether the policy is in effect. Only a published policy can be
          enabled.
  # status and is_enabled always have a value, and a policy has no "unset"
  # one to clear them to, so the config must set them. The spec lets a PUT
  # send null for "unchanged", and a nullable property isn't made required.
  - target: $["components"]["schemas"]["AccessPolicyInput"]["properties"]["status","is_enabled"]["anyOf"]
    remove: true
  - target: $["components"]["schemas"]["AccessPolicyInput"]["properties"]["status"]
    update:
      type: string
      enum: [draft, published]
  - target: $["components"]["schemas"]["AccessPolicyInput"]["properties"]["is_enabled"]
    update:
      type: boolean
  - target: $["components"]["schemas"]["AccessPolicyInput"]
    update:
      required: [name, business_justification, apps, status, is_enabled]

