overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Lumos V1 Terraform provider overlay
  version: 0.0.0
# Applied to original-openapi.json (the V1 spec from `make spec`). This file is
# the endpoint -> Terraform mapping: each resource or data source is an
# x-speakeasy-entity-operation on its endpoints plus x-speakeasy-entity on its
# schema. `make check-overlay` fails if any target below matches nothing in the
# spec, so a renamed or removed endpoint breaks the build instead of silently
# dropping a resource.
actions:
  - target: $["info"]["description"]
    update: >-
      ALPHA: the 1.x line targets the Lumos V1 API and may introduce breaking
      changes without prior notice. Pin an exact version. For production, stay
      on 0.x (version = "~> 0.10").

  # Retry rate limiting and server errors with exponential backoff.
  - target: $
    update:
      x-speakeasy-retries:
        strategy: backoff
        backoff:
          initialInterval: 500
          maxInterval: 30000
          maxElapsedTime: 60000
          exponent: 1.5
        statusCodes: ["429", "5XX"]
        retryConnectionErrors: true

  # data "lumos_current_user"
  - target: $["paths"]["/v1/users/current"]["get"]
    update:
      x-speakeasy-entity-operation: CurrentUser#read
  - target: $["components"]["schemas"]["User"]
    update:
      x-speakeasy-entity: CurrentUser

  # data "lumos_users". Cursor pagination makes the data source return
  # every page, not just the first.
  - target: $["paths"]["/v1/users"]["get"]
    update:
      x-speakeasy-entity-operation: Users#read
      x-speakeasy-pagination:
        type: cursor
        inputs:
          - name: page_token
            in: parameters
            type: cursor
        # No `results`: the API's contract is that only a null
        # next_page_token ends the list, so a short or empty page must not
        # stop paging.
        outputs:
          nextCursor: $.next_page_token
  - target: $["components"]["schemas"]["UserListOutput"]
    update:
      x-speakeasy-entity: Users
      x-speakeasy-entity-description: >-
        Users in the organization that match `search`, which is required.
  # Paging is the provider's job, so its parameters stay out of the
  # Terraform schema. Ask for the largest page to cut calls per read.
  - target: $["paths"]["/v1/users"]["get"]["parameters"][?@.name=="page_token"]
    update:
      x-speakeasy-terraform-ignore: true
  - target: $["paths"]["/v1/users"]["get"]["parameters"][?@.name=="page_size"]
    update:
      x-speakeasy-terraform-ignore: true
  - target: $["paths"]["/v1/users"]["get"]["parameters"][?@.name=="page_size"]["schema"]
    update:
      default: 100
  - target: $["components"]["schemas"]["UserListOutput"]["properties"]["next_page_token"]
    update:
      x-speakeasy-terraform-ignore: true

  # resource "lumos_app". One resource covers custom apps and connected
  # integrations; the create body's two halves are exclusive.
  - target: $["paths"]["/v1/apps"]["post"]
    update:
      x-speakeasy-entity-operation: App#create
  # Resource only; the app data sources are mapped separately. The app shows
  # its App Store settings read-only, which needs expand=appstore_settings on
  # this read.
  - target: $["paths"]["/v1/apps/{app_uuid}"]["get"]
    update:
      x-speakeasy-entity-operation:
        terraform-datasource: null
        terraform-resource: App#read
  - target: $["paths"]["/v1/apps/{app_uuid}"]["get"]["parameters"][?@.name=="expand"]
    update:
      x-speakeasy-terraform-ignore: true
  # Every update sends each field the plan holds, so a missing field was left
  # out of the config. The appUpdateBody hook sends null for a custom app's
  # missing logo_url and website_url, and keeps a connected app's metadata,
  # which the config can't set, from being written back as overrides.
  - target: $["paths"]["/v1/apps/{app_uuid}"]["patch"]
    update:
      x-speakeasy-entity-operation: App#update
  - target: $["paths"]["/v1/apps/{app_uuid}"]["delete"]
    update:
      x-speakeasy-entity-operation: App#delete
  - target: $["paths"]["/v1/apps/{app_uuid}"][*]["parameters"][?@.name=="app_uuid"]
    update:
      x-speakeasy-match: id
  - target: $["components"]["schemas"]["AppResponse"]
    update:
      x-speakeasy-entity: App
      x-speakeasy-entity-description: >-
        A custom app, or a connected integration. App Store settings show here
        read-only; manage them with `lumos_app_appstore_settings`.
  # Expanded, the settings are always the full shape.
  - target: $["components"]["schemas"]["AppResponse"]["properties"]["appstore_settings"]["anyOf"]
    remove: true
  - target: $["components"]["schemas"]["AppResponse"]["properties"]["appstore_settings"]
    update:
      anyOf: [{"$ref": "#/components/schemas/AppStoreSettingsResponse"}, {"type": "null"}]

  # resource "lumos_app_appstore_settings": writes an app's App Store
  # settings, which the API only accepts through their own endpoint. There is
  # no delete endpoint, so destroy leaves the settings as they are.
  - target: $["paths"]["/v1/apps/{app_uuid}/appstore-settings"]["get"]
    update:
      x-speakeasy-entity-operation:
        terraform-datasource: null
        terraform-resource: AppAppstoreSettings#read
  - target: $["paths"]["/v1/apps/{app_uuid}/appstore-settings"]["patch"]
    update:
      # Every update sends each setting the plan holds, and the plan holds
      # only what the config sets, empty lists for omitted lists, and null.
      # The request builder drops nulls, so the clearUnsetFields hook sends
      # null for each clearable setting missing from the body.
      x-speakeasy-entity-operation:
        - entityOperation: AppAppstoreSettings#create,update
  # Settings belong to one app; pointing the resource at another app means
  # managing a different app's settings.
  - target: $["paths"]["/v1/apps/{app_uuid}/appstore-settings"][*]["parameters"][?@.name=="app_uuid"]
    update:
      x-speakeasy-name-override: app_id
      x-speakeasy-param-force-new: true
  - target: $["components"]["schemas"]["AppStoreSettingsResponse"]
    update:
      x-speakeasy-entity: AppAppstoreSettings
      x-speakeasy-entity-description: >-
        An app's App Store settings: whether it's listed, who can request it,
        and what the request form asks. Keyed by the app's ID.
  # The API takes an app out of the App Store by setting in_app_store to
  # false, not with a DELETE. Destroy needs its own operation for that, so
  # this one exists only in the provider's spec: the trailing slash keeps its
  # path distinct, and the removeAppFromAppStore hook sends it to the real
  # settings endpoint with that body.
  - target: $["paths"]
    update:
      "/v1/apps/{app_uuid}/appstore-settings/":
        patch:
          operationId: v1RemoveAppFromAppStore
          summary: Remove an app from the App Store
          tags: ["Apps"]
          x-speakeasy-entity-operation: AppAppstoreSettings#delete
          parameters:
            - name: app_uuid
              in: path
              required: true
              schema: {type: string}
              x-speakeasy-name-override: app_id
          responses:
            "200":
              description: The app is no longer listed in the App Store.

  # Credentials are free-form per integration and never shown in plans.
  # A different app_class_id is a different integration, so it replaces.
  - target: $["components"]["schemas"]["AppCreateInput","AppUpdateInput"]["properties"]["auth","settings"]
    update:
      x-speakeasy-type-override: any
      x-speakeasy-param-sensitive: true
  - target: $["components"]["schemas"]["AppCreateInput","AppUpdateInput"]["properties"]["app_class_id"]
    update:
      x-speakeasy-param-force-new: true
  # A create body either connects an integration (app_class_id + auth) or
  # creates a custom app (label, category, description, ...); the API
  # rejects a body that mixes them. Checking it here fails the plan instead
  # of the apply. Connected apps don't set the metadata fields at all.
  - target: $["components"]["schemas"]["AppCreateInput"]["properties"]["app_class_id"]
    update:
      x-speakeasy-conflicts-with: [label, category, description, logo_url, website_url]
  # A custom app's label, category and description can't be cleared: null
  # resets them to the values the app was created with, so they're required
  # for a custom app instead.
  - target: $["components"]["schemas"]["AppCreateInput"]["properties"]["label","category","description"]
    update:
      x-speakeasy-xor-with: [app_class_id]
  # Removing app_class_id from a connected app's config fails the plan: there
  # is no empty value to clear it to, only a different, custom app.
  - target: $["components"]["schemas"]["AppCreateInput","AppUpdateInput"]["properties"]["app_class_id"]
    update:
      x-speakeasy-plan-modifiers: RejectIntegrationRemoval
  # Omitted on a custom app, these plan null and clear. A connected app can't
  # set them and keeps its integration's values.
  - target: $["components"]["schemas"]["AppResponse"]["properties"]["logo_url","website_url"]
    update:
      x-speakeasy-plan-modifiers: NullIfOmittedOnCustomApp
  # The spec's descriptions tell API callers what sending null on update
  # does. In a config, these follow it: required or cleared on a custom app,
  # and not settable on a connected app.
  - target: $["components"]["schemas"]["AppCreateInput","AppUpdateInput"]["properties"]
    update:
      app_class_id:
        description: >-
          Canonical identifier of an integration, e.g. `okta.com`. Setting it
          connects that integration with `auth`/`settings`; leaving it out
          creates a custom app. It can't be removed from a connected app's
          config.
      label:
        description: The app's display name in your organization. Required for a custom app; a connected app can't set it. At most 255 characters.
      category:
        description: >-
          The app's category. Required for a custom app; a connected app can't
          set it. Possible values: 'Accounting & Finance', 'Marketing &
          Analytics', 'Content & Social Media', 'Sales & Support', 'Design &
          Creativity', 'IT & Security', 'Developers', 'HR & Learning', 'Office
          & Legal', 'Communication', 'Collaboration', 'Commerce &
          Marketplaces', 'Other', 'Internal'
      description:
        description: The app's description. Required for a custom app; a connected app can't set it.
      logo_url:
        description: URL of the app's logo. On a custom app, omitted or set to `null`, the logo is cleared. A connected app can't set it.
      website_url:
        description: URL of the app's website. On a custom app, omitted or set to `null`, the website is cleared. A connected app can't set it.

  # request_instructions is writable through the app and through App Store
  # settings; only the latter can clear it, so only that one is exposed.
  - target: $["components"]["schemas"]["AppCreateInput","AppUpdateInput"]["properties"]["request_instructions"]
    update:
      x-speakeasy-terraform-ignore: true

  # A lumos_app update can't change these, so a plan keeps their current
  # values instead of showing them as known after apply. The slots and
  # appstore_settings change only through their own resources. A custom app
  # must set label, category and description, and a connected app can't, so
  # theirs keep the integration's values.
  - target: $["components"]["schemas"]["AppResponse"]["properties"]["id","status","post_approval_message","appstore_settings","approval_workflow","default_provisioning_workflow","default_deprovisioning_workflow","label","category","description"]
    update:
      x-speakeasy-param-suppress-computed-diff: true
  # These change only when an update reconnects the integration. Updates
  # resend auth and settings whenever they're set, so a connected app
  # reconnects on every update and a custom app never does.
  - target: $["components"]["schemas"]["AppResponse"]["properties"]["sync_status","disconnected","instance_id"]
    update:
      x-speakeasy-plan-modifiers: UnknownOnReconnect
  # A default fills every plan with that value, so the modifier above could
  # never plan disconnected as unknown, and an app that reads back
  # disconnected would plan a change to false on every run.
  - target: $["components"]["schemas"]["AppResponse"]["properties"]["disconnected"]["default"]
    remove: true

  # Expanded-only fields stay off the resource; the data source reads them.
  - target: $["components"]["schemas"]["AppResponse"]["properties"]["admins","custom_attributes"]
    update:
      x-speakeasy-terraform-ignore: true
  # Unexpanded, a workflow slot is always {id}.
  - target: $["components"]["schemas"]["AppResponse"]["properties"]["approval_workflow","default_provisioning_workflow","default_deprovisioning_workflow"]["anyOf"]
    remove: true
  - target: $["components"]["schemas"]["AppResponse"]["properties"]["approval_workflow","default_provisioning_workflow","default_deprovisioning_workflow"]
    update:
      anyOf: [{"$ref": "#/components/schemas/WorkflowRef"}, {"type": "null"}]

  # Time-based access options are written as labels but read back as
  # {label, value_seconds} objects, and one attribute needs one shape. The
  # settings read keeps only the labels, so Terraform works in labels both
  # ways. Overridden inline here because the catalog response shares the
  # TimeBasedAccess schema.
  - target: $["components"]["schemas"]["AppStoreSettingsResponse"]["properties"]["time_based_access"]["$ref"]
    remove: true
  - target: $["components"]["schemas"]["AppStoreSettingsResponse"]["properties"]["time_based_access"]
    update:
      type: object
      properties:
        options:
          anyOf: [{"type": "array", "items": {"type": "string"}}, {"type": "null"}]
          description: Labels of the time-based access options offered for this app. An empty list means the app uses the domain-level defaults.
        default:
          anyOf: [{"type": "string"}, {"type": "null"}]
          description: Label of the option pre-selected when a user opens the request form. Null means no option is pre-selected.
  # The API also reads an empty list back as null, so the read turns those
  # into [] and a config that sets [] to clear one matches what's read.
  - target: $["components"]["schemas"]["AppStoreSettingsResponse"]
    update:
      x-speakeasy-transform-from-api:
        jq: |
          .allowed_requester_group_uuids |= (. // [])
          | .custom_intake_fields |= (. // [])
          | .time_based_access.options |= (if . == null then [] else map(.label) end)

  # Requester groups have no order and no duplicates in the API.
  - target: $["components"]["schemas"]["AppStoreSettingsPatchInput","AppStoreSettingsResponse"]["properties"]["allowed_requester_group_uuids"]["anyOf"][?@.type=="array"]
    update:
      format: set

  # Every setting follows the config, so the provider never fills one in
  # from what the API holds. A setting the API can't clear always has a
  # value, and its starting value varies by app, so the config must set it.
  - target: $["components"]["schemas"]["AppStoreSettingsPatchInput"]
    update:
      required: [in_app_store, catalog_visibility, allow_permission_selection, allow_multiple_permission_selection]
  # Omitting one of these plans null, which clears it.
  - target: $["components"]["schemas"]["AppStoreSettingsResponse"]["properties"]["redirect_url","request_instructions","request_validation_webhook_uuid","default_entitlement"]
    update:
      x-speakeasy-param-computed: false
  - target: $["components"]["schemas"]["AppStoreSettingsResponse"]["properties"]["time_based_access"]["properties"]["default"]
    update:
      x-speakeasy-param-computed: false
  # Omitting a list plans it empty, which clears it; the read above turns the
  # API's null back into [], so the next plan matches. Omitting time-based
  # access plans empty options and no default. A spec default can't express
  # this for the intake fields or time-based access, so a plan modifier does
  # it. It goes on the request schemas: lumos_app shows the response schema
  # read-only, where nothing is configured.
  - target: $["components"]["schemas"]["AppStoreSettingsPatchInput"]["properties"]["allowed_requester_group_uuids","custom_intake_fields","time_based_access"]
    update:
      x-speakeasy-plan-modifiers: EmptyWhenNull
  - target: $["components"]["schemas"]["TimeBasedAccessPatchInput"]["properties"]["options"]
    update:
      x-speakeasy-plan-modifiers: EmptyWhenNull
  # The API reads an intake field's omitted description or dropdown options
  # back as null. Left computed, a plan fills an omitted one from the field
  # that had the same position before, so inserting a field would send its
  # neighbour's description.
  - target: $["components"]["schemas"]["CustomIntakeField"]["properties"]["description","dropdown_options"]
    update:
      x-speakeasy-param-computed: false

  # The spec's descriptions tell API callers what omitting a field or
  # sending null does. In a config, omitting a setting and setting it to
  # null are the same, and both clear it.
  - target: $["components"]["schemas"]["AppStoreSettingsPatchInput"]["properties"]
    update:
      in_app_store:
        description: Whether this app is listed in the App Store catalog.
      catalog_visibility:
        description: Visibility within the catalog.
      request_instructions:
        description: Custom instructions shown on the access-request form. Omitted or set to `null`, the instructions are cleared.
      allow_permission_selection:
        description: When true, requesters may select which permission to request. When false, the default permission is used automatically and only approvers can change it.
      allow_multiple_permission_selection:
        description: When true, requesters may select more than one permission per request.
      allowed_requester_group_uuids:
        description: UUIDs of the groups whose members may request this app. Omitted or set to `null`, it's cleared to an empty set, which lets anyone in the organization request it.
      time_based_access:
        description: Time-based access options and the pre-selected default. Omitted or set to `null`, the options are cleared to an empty list and the default to `null`.
      request_validation_webhook_uuid:
        description: UUID of the inline webhook called to validate access requests. Omitted or set to `null`, the webhook is cleared.
      redirect_url:
        description: If set, requesting this app redirects the user to this URL instead of going through the normal access-request flow. Max 2048 characters. Omitted or set to `null`, the redirect is cleared.
      default_entitlement:
        description: Entitlement to pre-select on the access-request form. Must belong to this app. Omitted or set to `null`, the pre-selection is cleared.
      custom_intake_fields:
        description: The complete list of custom intake fields, matched by `reference_key`. Fields left out of the list are deleted. Omitted or set to `null`, it's cleared to an empty list, which deletes all of them.
  - target: $["components"]["schemas"]["TimeBasedAccessPatchInput"]["properties"]
    update:
      options:
        description: Labels of the organization's time-based access options to offer for this app. Omitted or set to `null`, it's cleared to an empty list, which reverts to the organization's defaults.
      default:
        description: Label of the option pre-selected on the request form. Omitted or set to `null`, the pre-selection is cleared.

  # resource "lumos_entitlement". The API creates, renames and deletes an
  # entitlement; everything else on it is read-only here. App Store settings
  # show read-only, which needs expand=appstore_settings on this read.
  - target: $["paths"]["/v1/entitlements"]["post"]
    update:
      x-speakeasy-entity-operation: Entitlement#create
  - target: $["paths"]["/v1/entitlements/{entitlement_uuid}"]["get"]
    update:
      x-speakeasy-entity-operation:
        terraform-datasource: null
        terraform-resource: Entitlement#read
  - target: $["paths"]["/v1/entitlements/{entitlement_uuid}"]["get"]["parameters"][?@.name=="expand"]
    update:
      x-speakeasy-terraform-ignore: true
  - target: $["paths"]["/v1/entitlements/{entitlement_uuid}"]["patch"]
    update:
      x-speakeasy-entity-operation: Entitlement#update
  - target: $["paths"]["/v1/entitlements/{entitlement_uuid}"]["delete"]
    update:
      x-speakeasy-entity-operation: Entitlement#delete
  - target: $["paths"]["/v1/entitlements/{entitlement_uuid}"][*]["parameters"][?@.name=="entitlement_uuid"]
    update:
      x-speakeasy-match: id
  - target: $["components"]["schemas"]["EntitlementOutput"]
    update:
      x-speakeasy-entity: Entitlement
      x-speakeasy-entity-description: >-
        An entitlement on an app: a role, license, group or permission. App
        Store settings show here read-only; manage them with
        `lumos_entitlement_appstore_settings`.
  # An entitlement belongs to one app for its whole life.
  - target: $["components"]["schemas"]["EntitlementCreateInput"]["properties"]["app_id"]
    update:
      x-speakeasy-param-force-new: true
  # Unexpanded, a workflow slot is always {id}.
  - target: $["components"]["schemas"]["EntitlementOutput"]["properties"]["approval_workflow_override","provisioning_workflow","deprovisioning_workflow"]["anyOf"]
    remove: true
  - target: $["components"]["schemas"]["EntitlementOutput"]["properties"]["approval_workflow_override","provisioning_workflow","deprovisioning_workflow"]
    update:
      anyOf: [{"$ref": "#/components/schemas/WorkflowRef"}, {"type": "null"}]
  # An update only renames, so a plan keeps the current value of everything
  # else instead of showing it as known after apply.
  - target: $["components"]["schemas"]["EntitlementOutput"]["properties"]["id","app_id","entitlement_type_label","source","description","approval_workflow_override","provisioning_workflow","deprovisioning_workflow","custom_approval_message_override","appstore_settings"]
    update:
      x-speakeasy-param-suppress-computed-diff: true

  # resource "lumos_entitlement_appstore_settings": writes an entitlement's
  # App Store settings through their own endpoint.
  - target: $["paths"]["/v1/entitlements/{entitlement_uuid}/appstore-settings"]["get"]
    update:
      x-speakeasy-entity-operation:
        terraform-datasource: null
        terraform-resource: EntitlementAppstoreSettings#read
  - target: $["paths"]["/v1/entitlements/{entitlement_uuid}/appstore-settings"]["patch"]
    update:
      x-speakeasy-entity-operation:
        - entityOperation: EntitlementAppstoreSettings#create,update
  # Settings belong to one entitlement; pointing the resource at another
  # entitlement means managing a different entitlement's settings.
  - target: $["paths"]["/v1/entitlements/{entitlement_uuid}/appstore-settings"][*]["parameters"][?@.name=="entitlement_uuid"]
    update:
      x-speakeasy-name-override: entitlement_id
      x-speakeasy-param-force-new: true
  - target: $["components"]["schemas"]["EntitlementAppStoreSettings"]
    update:
      x-speakeasy-entity: EntitlementAppstoreSettings
      x-speakeasy-entity-description: >-
        An entitlement's App Store settings: whether it's listed, and its
        overrides of the app's requester groups, time-based access options and
        request validation webhook. Keyed by the entitlement's ID.
  # The API hides an entitlement from the App Store by setting
  # visible_in_appstore to false, not with a DELETE. As for apps, destroy
  # uses an operation that exists only in the provider's spec, and a hook
  # sends it to the real settings endpoint with that body.
  - target: $["paths"]
    update:
      "/v1/entitlements/{entitlement_uuid}/appstore-settings/":
        patch:
          operationId: v1RemoveEntitlementFromAppStore
          summary: Hide an entitlement from the App Store
          tags: ["Entitlements"]
          x-speakeasy-entity-operation: EntitlementAppstoreSettings#delete
          parameters:
            - name: entitlement_uuid
              in: path
              required: true
              schema: {type: string}
              x-speakeasy-name-override: entitlement_id
          responses:
            "200":
              description: The entitlement is no longer listed in the App Store.

  # The settings read returns groups and the webhook as {id} refs and
  # time-based access options as {label, value_seconds}, while the write
  # takes UUIDs and labels. One attribute needs one shape, so the read is
  # reshaped into the write's fields. null stays null: for groups and
  # time-based access, null means the entitlement inherits the app's
  # setting, and an empty group list is a different setting.
  - target: $["components"]["schemas"]["EntitlementAppStoreSettings"]["properties"]["allowed_requester_groups_override","request_validation_webhook"]
    remove: true
  - target: $["components"]["schemas"]["EntitlementAppStoreSettings"]["properties"]
    update:
      allowed_requester_group_uuids_override:
        anyOf: [{"type": "array", "items": {"type": "string"}, "format": "set"}, {"type": "null"}]
        description: UUIDs of the groups whose members may request this entitlement, overriding the app's allowed requester groups. Null means the entitlement inherits the app's groups.
      request_validation_webhook_uuid:
        anyOf: [{"type": "string"}, {"type": "null"}]
        description: UUID of the inline webhook called to validate access requests for this entitlement. Null means the entitlement has no webhook of its own.
  - target: $["components"]["schemas"]["EntitlementAppStoreSettings"]["properties"]["time_based_access_override"]["anyOf"]
    remove: true
  - target: $["components"]["schemas"]["EntitlementAppStoreSettings"]["properties"]["time_based_access_override"]
    update:
      anyOf: [{"$ref": "#/components/schemas/EntitlementTimeBasedAccessOverridePatchInput"}, {"type": "null"}]
  - target: $["components"]["schemas"]["EntitlementAppStoreSettings"]
    update:
      x-speakeasy-transform-from-api:
        jq: |
          if . == null then . else
            .allowed_requester_group_uuids_override = (.allowed_requester_groups_override | if . == null then null else map(.id) end)
            | .request_validation_webhook_uuid = .request_validation_webhook.id
            | .time_based_access_override |= (if . == null then null else {options: (.options | map(.label))} end)
            | del(.allowed_requester_groups_override, .request_validation_webhook)
          end
  # Requester groups have no order and no duplicates in the API.
