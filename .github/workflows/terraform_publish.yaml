# Terraform Provider release workflow.
name: Release

# This GitHub action creates a release when a tag that matches the pattern
# "v*" (e.g. v0.1.0) is created.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Releases need permissions to read and write the repository contents.
# GitHub considers creating releases and uploading assets as writing contents.
permissions:
  contents: write

jobs:
  goreleaser:
    environment: Release
    runs-on: ubuntu-latest
    steps:
      # release/v1 releases the 1.x line only; 0.x releases from master.
      - name: Check this is a v1.* tag
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v1.')
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::release/v1 only releases v1.* tags, got $REF_TYPE '$REF_NAME'"
          exit 1
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3 # v3.5.0
        with:
          # Allow goreleaser to access older tag information.
          fetch-depth: 0
      # setup-go builds with the version in go.mod's go directive. Go releases
      # before 1.26.10 still trust the compromised eMudhra intermediate
      # certificates (CVE-2026-111943).
      - name: Check go.mod requires Go 1.26.10 or later
        run: |
          required=1.26.10
          declared=$(awk '$1 == "go" { print $2; exit }' go.mod)
          if [ "$(printf '%s\n%s\n' "$required" "$declared" | sort -V | head -n1)" != "$required" ]; then
            echo "::error::go.mod declares go $declared; releases must build with Go $required or later"
            exit 1
          fi
      - uses: actions/setup-go@4d34df0c2316fe8122ab82dc22947d607c0c91f9 # v4.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@111c56156bcc6918c056dbef52164cfa583dc549 # v5.2.0
        id: import_gpg
        with:
          fingerprint: "F7FFD8D8D816AE3F8A6B6A0C9B9EA29C4ED23991"
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f82d6c1c344bcacabba2c841718984797f664a6b # v4.2.0
        with:
          args: release --clean
        env:
          # GitHub sets the GITHUB_TOKEN secret automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}